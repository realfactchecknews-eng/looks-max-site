<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pillGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9ecc9"/>
      <stop offset="100%" stop-color="#d4af6a"/>
    </linearGradient>
    <linearGradient id="pillGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8944f"/>
      <stop offset="100%" stop-color="#7d5f2c"/>
    </linearGradient>
    <linearGradient id="pillShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="pillShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="pillClip">
      <rect x="8" y="20" width="48" height="24" rx="12"/>
    </clipPath>
  </defs>
  <g transform="rotate(-35 32 32)" filter="url(#pillShadow)">
    <g clip-path="url(#pillClip)">
      <rect x="8" y="20" width="24" height="24" fill="url(#pillGoldDark)"/>
      <rect x="32" y="20" width="24" height="24" fill="url(#pillGoldLight)"/>
      <rect x="8" y="20" width="48" height="10" fill="url(#pillShine)"/>
    </g>
    <rect x="8" y="20" width="48" height="24" rx="12" fill="none" stroke="#4a3a1a" stroke-width="1" stroke-opacity="0.5"/>
  </g>
</svg>
